<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Home — P0</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--bg:#eef1fa;--panel:#ffffff;--soft:#f4f6fc;--text:#252a43;--muted:#626b86;--line:#dde2f0;--accent:#6356d8;--accent2:#207f97;--wash:#eeebff;--bad:#a7354d;--good:#187450;--shadow:0 20px 60px #31326312}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55}
body.dark{color-scheme:dark;--bg:#111525;--panel:#1b2035;--soft:#222940;--text:#eff1ff;--muted:#b0b9d4;--line:#343c59;--accent:#b7aaff;--accent2:#8ad7e7;--wash:#302d4b;--bad:#ff9db2;--good:#86dfb5;--shadow:0 20px 60px #0003}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 14px;min-height:42px}button:hover{border-color:var(--accent);background:var(--wash)}button:disabled{cursor:default;opacity:.55}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}body.dark .primary{color:#1a1633}.primary:hover{background:var(--accent);filter:brightness(.96)}
.quiet{background:transparent;border-color:transparent}.active{background:var(--wash);color:var(--accent);border-color:var(--wash)}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}textarea{resize:vertical;min-height:94px;max-height:240px}
h1,h2,h3,p{margin-top:0}h1{font-size:30px;line-height:1.25;letter-spacing:-1px;font-weight:600}h2{font-size:22px;letter-spacing:-.5px;font-weight:600}h3{font-size:15px;font-weight:600}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{color:var(--accent);text-transform:uppercase;font-size:11px;letter-spacing:2px;font-weight:600}
.demo{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 22px;border-bottom:1px solid var(--line);background:var(--soft);font-size:12px}
.tools,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tools button{min-height:32px;padding:5px 10px;font-size:12px}
.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:600;letter-spacing:-.5px}
.orb{display:inline-grid;place-items:center;width:35px;height:35px;border-radius:50%;background:linear-gradient(135deg,#7163e8,#56bad3);box-shadow:0 0 0 5px var(--wash);color:#fff;font-size:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 25px}
.wizard{max-width:1020px;margin:18px auto 50px;padding:0 22px;display:grid;grid-template-columns:290px 1fr;gap:28px}
.intro{padding:28px 15px}.intro h1{font-size:38px;margin-top:20px}.orbit{height:140px;position:relative;margin:35px 0;display:grid;place-items:center}
.orbit:before,.orbit:after{content:"";position:absolute;width:210px;height:85px;border:1px solid var(--line);border-radius:50%;transform:rotate(-23deg)}.orbit:after{transform:rotate(23deg)}.orbit .orb{width:66px;height:66px;font-size:28px;box-shadow:0 0 0 14px var(--wash),0 15px 40px #6356d830}
.surface{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px}
.steps{display:flex;gap:8px;margin-bottom:26px}.step{flex:1;height:4px;background:var(--line);border-radius:4px}.step.on{background:var(--accent)}
.field{margin:17px 0}.field label{display:block;margin-bottom:7px;font-weight:500}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{padding:20px;text-align:left;min-height:145px}.mode strong{display:block;margin-bottom:10px;font-size:17px}.mode span{display:block;color:var(--muted)}
.footer{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.hint{background:var(--soft);border-radius:12px;padding:14px;font-size:13px;margin-top:16px}.error{color:var(--bad)}.success{color:var(--good)}
.shell{display:grid;grid-template-columns:225px minmax(0,1fr);height:calc(100vh - 129px);min-height:650px;border-top:1px solid var(--line)}
aside.nav{padding:20px 14px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:7px;overflow:auto}
.profile{padding:12px;background:var(--soft);border-radius:14px;margin-bottom:12px}.profile select{border:0;padding:3px;background:transparent;font-weight:600}.nav button{text-align:left;width:100%}.nav .sub{padding:10px 14px;color:var(--muted);font-size:12px}.nav .bottom{margin-top:auto}
main{min-width:0;overflow:auto}.main-head{padding:24px 30px 16px;display:flex;justify-content:space-between;gap:12px;align-items:start}.main-head h2{margin-bottom:4px}
.chat-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;padding:0 30px 24px}.chat-layout.closed{grid-template-columns:1fr}
.chat{display:flex;flex-direction:column;min-height:480px}.messages{flex:1;padding:12px 0}.msg{margin:0 0 22px;display:flex;gap:12px;align-items:start}.avatar{flex:0 0 33px;border-radius:11px;background:var(--wash);color:var(--accent);padding:6px;text-align:center;font-weight:600}.bubble{background:var(--panel);border:1px solid var(--line);border-radius:0 15px 15px 15px;padding:16px 18px;max-width:650px;white-space:pre-wrap;overflow-wrap:anywhere}.human .bubble{background:var(--wash);border-color:transparent}.msg small{display:block;color:var(--muted);margin-top:7px}
.composer{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px}.composer textarea{background:transparent;border:0;padding:7px;min-height:70px}.composer-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}.attachment{background:var(--wash);padding:7px 10px;border-radius:8px;margin:5px 0}
.sidecard{background:var(--panel);padding:20px;border:1px solid var(--line);border-radius:18px;margin-bottom:14px}.sidecard p{font-size:13px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px}
.content{padding:0 30px 35px;max-width:1200px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 22px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.item{border:1px solid var(--line);background:var(--panel);padding:21px;border-radius:16px}.item h3{margin-bottom:8px}.item p{font-size:13px}.badge{display:inline-block;padding:3px 8px;border-radius:6px;background:var(--wash);color:var(--accent);font-size:11px}
.metadata{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px}.metadata dt{color:var(--muted)}.metadata dd{margin:0}
.timeline{border-left:2px solid var(--line);margin:15px;padding-left:24px}.event{position:relative;margin:0 0 24px}.event:before{content:"";position:absolute;left:-30px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}.event p{margin:5px 0}.settings{max-width:700px}.settings .item{margin-bottom:18px}
.empty{text-align:center;padding:55px 20px}.empty .orb{margin-bottom:25px}.empty h2{margin-bottom:10px}
dialog{padding:0;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text);width:min(600px,calc(100vw - 30px));max-height:90vh;box-shadow:var(--shadow)}dialog::backdrop{background:#10152e88;backdrop-filter:blur(4px)}.modal{padding:26px}.modal-head{display:flex;align-items:start;justify-content:space-between;gap:15px}.modal-head h2{margin-bottom:5px}.choice{display:block;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}.choice input{width:auto;margin-right:10px}.choice strong{font-weight:500}.choice span{display:block;padding-left:25px;font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;background:var(--text);color:var(--panel);box-shadow:var(--shadow);z-index:10;max-width:90vw}
[hidden]{display:none!important}.previewmark{font-size:11px;color:var(--muted)}.danger{color:var(--bad)}
@media(max-width:1000px){.chat-layout{grid-template-columns:1fr}.context-panel{display:grid;grid-template-columns:1fr 1fr;gap:12px}.shell{grid-template-columns:195px 1fr}.wizard{grid-template-columns:240px 1fr}}
@media(max-width:650px){header{padding:14px}.demo{padding:8px 12px;align-items:start}.demo>span{max-width:190px}.wizard{display:block;margin:0;padding:12px}.intro{padding:5px 10px}.intro h1{font-size:27px;margin:12px 0}.intro .orbit,.intro>p{display:none}.surface{padding:20px}.grid2,.cards{grid-template-columns:1fr}.mode{min-height:100px}.shell{display:block;height:auto;min-height:0}.nav{border-right:0!important;border-bottom:1px solid var(--line);display:block!important;padding:10px!important}.nav .profile{margin-bottom:8px}.nav .sub,.nav .bottom{display:none}.nav button{width:auto;display:inline-block;padding:8px}.main-head{padding:20px 16px}.chat-layout,.content{padding:0 16px 22px}.context-panel{display:block}.chat{min-height:430px}.main-head .row{justify-content:flex-end}.brand{font-size:17px}.tools{gap:3px}.tools button{padding:5px 8px}}
</style>

const profiles=[{name:'Orion',mode:'standard',provider:'OpenRouter',model:'Selected model',scribe:true,scribeModel:'small',lastMemoryStatus:'attempt2',capacity:'300',context:D.pl.contextBody,versions:[D.pl.contextBody,'Cel: zaprojektować AI Home. Ustalono oddzielne profile i pamięć z pochodzeniem.'],outdated:false,files:[],chats:[{title:'Projektujemy AI Home',messages:[{who:'human',text:D.pl.sampleHuman},{who:'ai',text:D.pl.sampleAI}]}],chat:0,events:[{key:'attempt1',detail:'438 / 300',bad:true},{key:'attempt2',detail:'287 / 300',bad:false}]},
{name:'Aura',mode:'standard',provider:'Google',model:'Selected model',scribe:true,scribeModel:'balanced',lastMemoryStatus:null,capacity:'300',context:'',versions:[],outdated:false,files:[],chats:[{title:'Nowa rozmowa',messages:[]}],chat:0,events:[]}];
let pi=0,fileSequence=0;const root=document.getElementById('app'),modal=document.getElementById('modal');const t=k=>D[lang][k]||k,p=()=>profiles[pi],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(k,action,cls='')=>'<button type="button" class="'+cls+'" data-action="'+action+'">'+t(k)+'</button>';
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.hidden=false;setTimeout(()=>el.hidden=true,3500)}
function header(){return '<div class="demo"><span>'+t('demo')+'</span><div class="tools">'+btn(onboarding?'app':'setup',onboarding?'open':'setup')+'</div></div><header><div class="brand"><span class="orb" aria-hidden="true">✧</span> AI Home</div><div class="tools">'+btn('theme','theme')+btn('lang','lang')+'</div></header>'}
function render(){document.documentElement.lang=lang;document.body.classList.toggle('dark',dark);root.innerHTML=header()+(onboarding?wizard():shell());}
function wizard(){let body='';
if(step===0)body='<h2>'+t('mode')+'</h2><div class="grid2"><button data-mode="standard" class="mode '+(mode==='standard'?'active':'')+'" aria-pressed="'+(mode==='standard')+'"><strong>Standard</strong><span>'+t('standard')+'</span></button><button data-mode="conscious" disabled class="mode '+(mode==='conscious'?'active':'')+'" aria-pressed="'+(mode==='conscious')+'"><strong>Conscious</strong><span>'+t('conscious')+'</span></button></div><p class="hint">'+t('modeNote')+'</p>';
if(step===1)body='<h2>'+t('connection')+'</h2><div class="field"><label for="provider">'+t('provider')+'</label><select id="provider">'+['OpenRouter','OpenAI','Google','Anthropic','Custom OpenAI-compatible'].map(x=>'<option '+(provider===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'+(provider.startsWith('Custom')?'<div class="field"><label for="endpoint">'+t('endpoint')+'</label><input id="endpoint" value="'+esc(endpoint)+'" placeholder="http://localhost:1234/v1"></div>':'')+'<div class="field"><label for="key">'+t('key')+'</label><input id="key" type="password" autocomplete="off" value="'+esc(key)+'" placeholder="demo"><small class="muted">'+t('keyHint')+'</small></div><div class="row">'+btn('test','test','primary')+btn('errorDemo','testError','quiet')+'</div><p id="connectionStatus" role="status" class="'+(connectError?'error':'success')+'">'+(connectError?t('testBad'):tested?t('testGood'):t('needsTest'))+'</p>';
if(step===2)body='<h2>'+t('models')+'</h2><div class="field"><label for="model">'+t('primary')+'</label><select id="model"><option '+(model==='Selected model'?'selected':'')+'>Selected model</option><option '+(model==='Local model'?'selected':'')+'>Local model</option></select></div><div class="field"><label for="scribe">'+t('scribe')+'</label><select id="scribe"><option value="on" '+(scribe?'selected':'')+'>'+t('auto')+'</option><option value="off" '+(!scribe?'selected':'')+'>'+t('disabled')+'</option></select></div>'+(scribe?'<div class="field"><label for="scribeModel">'+t('scribeModel')+'</label><select id="scribeModel">'+['small','balanced'].map(v=>'<option value="'+v+'" '+(scribeModel===v?'selected':'')+'>'+ (v==='small'?'Small demo model':'Balanced demo model')+' · '+esc(provider)+'</option>').join('')+'</select></div>':'')+'<p class="hint">'+t(scribe?'scribeNote':'scribeWarn')+'</p>';
if(step===3)body='<h2>'+t('identity')+'</h2><div class="field"><label for="name">'+t('name')+'</label><input id="name" maxlength="60" value="'+esc(name)+'"></div>'+btn('chooseName','chooseName')+'<p class="hint">'+t('identityNote')+'</p><p class="small muted">'+t('limit')+': 300 '+t('tokens')+'</p>';
return '<section class="wizard"><div class="intro"><span class="eyebrow">AI HOME / FIRST CONTACT</span><h1>'+t('welcome')+'</h1><p class="muted">'+t('intro')+'</p><div class="orbit"><span class="orb" aria-hidden="true">✧</span></div><small class="muted">'+t('notSaved')+'</small></div><div class="surface"><div class="steps" aria-label="'+t('step')+' '+(step+1)+' '+t('of')+' 4">'+[0,1,2,3].map(i=>'<div class="step '+(i<=step?'on':'')+'"></div>').join('')+'</div><p class="eyebrow">'+t('step')+' '+(step+1)+' / 4</p>'+body+'<div class="footer">'+(step?btn('back','back'):adding?btn('cancel','open'):'<span></span>')+'<button class="primary" data-action="'+(step===3?'launch':'next')+'" '+(step===1&&!tested?'disabled':'')+'>'+t(step===3?'launch':'next')+' →</button></div></div></section>'}
function nav(){return '<aside class="nav"><div class="profile"><label for="profile" class="small muted">'+t('name')+'</label><select id="profile">'+profiles.map((x,i)=>'<option value="'+i+'" '+(i===pi?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><small class="muted">'+esc(p().provider)+'</small></div>'+btn('newProfile','newProfile','quiet')+btn('newChat','newChat','primary')+'<div style="height:8px"></div>'+['chat','memory','knowledge','rules','activity','settings'].map(k=>'<button data-view="'+k+'" class="'+(view===k?'active':'quiet')+'">'+({chat:'◌',memory:'◇',knowledge:'▤',rules:'≋',activity:'◷',settings:'⚙'}[k])+' &nbsp; '+t(k)+'</button>').join('')+'<div class="sub">'+t('history')+'</div>'+p().chats.map((x,i)=>'<button class="quiet" data-chat="'+i+'">'+esc(x.title)+'</button>').join('')+'<div class="bottom small muted"><span class="dot"></span>'+(p().mode==='conscious'?'Conscious · '+t('paused'):'Standard')+'<br>'+t('notSaved')+'</div></aside>'}
function shell(){return '<div class="shell">'+nav()+'<main>'+main()+'</main></div>'}
function heading(title,sub,actions=''){return '<div class="main-head"><div><h2>'+esc(title)+'</h2><p class="muted small">'+esc(sub)+'</p></div><div class="row">'+actions+'</div></div>'}
function contextPanel(){const q=p();return '<section class="context-panel"><div class="sidecard"><span class="eyebrow">L2 / '+t('working')+'</span><h3 style="margin-top:12px">'+t('context')+'</h3><p class="'+(q.outdated?'hint':'')+'">'+esc(q.outdated?t('inactiveContext'):q.context||t('emptyProfile'))+'</p><small class="muted">'+t('limit')+': '+(q.capacity==='unlimited'?t('unlimited'):esc(q.capacity)+' '+t('tokens'))+'</small><div style="margin-top:13px">'+btn('view','memory','quiet')+'</div></div><div class="sidecard"><h3>'+t('recent')+'</h3><p>'+t(q.lastMemoryStatus||'emptyProfile')+'</p><small class="muted">'+t('provenance')+'</small></div><div class="sidecard"><h3>'+t('includedGuidance')+'</h3><p>'+esc(q.files.filter(f=>f.purpose==='2'&&f.enabled).map(f=>f.name).join(', ')||t('guidanceEmpty'))+'</p><small class="muted">'+t('guidanceNote')+'</small></div></section>'}

function main(){if(view==='chat'){const c=p().chats[p().chat];return heading(c.title,(p().mode==='conscious'?'Conscious · '+t('paused'):t('chatSub')),btn('panel','panel'))+'<div class="chat-layout '+(!panel?'closed':'')+'"><section class="chat"><div class="messages">'+(c.messages.length?c.messages.map(m=>'<div class="msg '+(m.who==='human'?'human':'')+'"><div class="avatar">'+(m.who==='human'?'E':esc(p().name[0]))+'</div><div><div class="bubble">'+esc(m.text)+'</div><small>'+esc(m.who==='human'?t('human'):p().name)+'</small></div></div>').join(''):'<div class="empty"><span class="orb">✧</span><h2>'+t('emptyTitle')+'</h2><p class="muted">'+t('emptyText')+'</p></div>')+'</div><div class="composer">'+p().files.filter(f=>f.purpose==='0'&&f.chat===p().chat).map(f=>'<div class="attachment small">▤ '+esc(f.name)+' · '+t('pur0')+'</div>').join('')+'<textarea id="message" aria-label="'+t('placeholder')+'" placeholder="'+t('placeholder')+'">'+esc(c.draft||'')+'</textarea><div class="composer-foot">'+btn('attach','import','quiet')+btn(timer?'stop':'send',timer?'stop':'send','primary')+'</div></div></section>'+(panel?contextPanel():'')+'</div>'}
if(view==='memory')return heading(t('memory'),t('memSub'))+'<div class="content"><div class="tabs">'+['working','episodic','relations','longterm','intents'].map(x=>'<button data-tab="'+x+'" class="'+(tab===x?'active':'quiet')+'">'+t(x)+'</button>').join('')+'</div>'+(tab==='working'?'<div class="item"><div class="row" style="justify-content:space-between"><h3>'+t('context')+'</h3><span class="badge">'+(p().outdated?t('inactive'):t('version')+' '+Math.max(1,p().versions.length))+'</span></div><p>'+esc(p().context||t('emptyProfile'))+'</p><dl class="metadata"><dt>'+t('source')+'</dt><dd>'+t('sourceChat')+'</dd><dt>'+t('author')+'</dt><dd>'+esc(p().name)+' / Scribe</dd><dt>'+t('limit')+'</dt><dd>'+esc(p().capacity==='unlimited'?t('unlimited'):p().capacity)+' · '+t('tokens')+'</dd></dl><div class="row">'+btn('versions','versions')+btn('old','outdated','quiet')+'</div></div>':'<div class="item"><h3>'+t(tab)+'</h3><p class="muted">'+t('emptyProfile')+'</p></div>')+'</div>';
if(view==='knowledge')return heading(t('knowledge'),t('knowledgeSub'),btn('import','import','primary'))+'<div class="content"><div class="cards">'+(p().files.filter(f=>f.purpose!=='0').map(f=>'<article class="item"><span class="badge">'+t('pur'+f.purpose)+'</span><h3 style="margin-top:12px">'+esc(f.name)+'</h3><dl class="metadata"><dt>'+t('added')+'</dt><dd>'+t('importer')+'</dd><dt>'+t('author')+'</dt><dd>'+t(f.author)+'</dd><dt>'+t('source')+'</dt><dd>'+esc(f.name)+' · '+esc(f.date)+'</dd></dl>'+(f.purpose==='3'?'<p class="muted">'+t(f.decision==='accept'?'acceptedDemo':f.decision==='modify'?'modifiedDemo':f.decision==='reject'?'rejectedDemo':'pending')+'</p>'+(f.decision==='modify'?'<p>'+t('modifiedText')+'</p>':'')+'<button data-decision="'+f.id+'">'+t('simulateDecision')+'</button>':f.purpose==='2'?'<p>'+t(f.enabled?'includedGuidance':'guidanceOff')+'</p><button data-guidance="'+f.id+'">'+t(f.enabled?'disableGuidance':'enableGuidance')+'</button>':'<small class="muted">'+t('provenance')+'</small>')+'</article>').join('')||'<div class="item"><p class="muted">'+t('noFiles')+'</p></div>')+'</div><p class="hint">'+t('guidanceNote')+'</p></div>';
if(view==='rules')return heading(t('rules'),t('rulesSub'))+'<div class="content"><div class="item"><span class="badge">'+t('approved')+'</span><h3 style="margin-top:15px">'+(pi===0?esc(D.pl.ruleBody):t('emptyProfile'))+'</h3><p class="muted">'+t('sourceChat')+' · '+t('version')+' 1</p></div></div>';
if(view==='activity')return heading(t('activity'),t('activitySub'))+'<div class="content"><div class="item timeline">'+(p().events.map(e=>'<div class="event"><small class="muted">'+esc(e.time||'P0 · DEMO')+'</small><h3 class="'+(e.bad?'error':'success')+'">'+t(e.key)+'</h3><p>'+esc(e.detail||'')+' '+(e.detail?t('tokens'):'')+'</p><small class="muted">'+t(e.key==='attemptFailed'?'finalFailure':e.bad?'retryInfo':'provenance')+'</small></div>').join('')||'<p class="muted">'+t('emptyProfile')+'</p>')+'</div></div>';
return heading(t('settings'),t('settingsSub'))+'<div class="content settings"><section class="item"><h3>'+t('capacity')+'</h3><div class="field"><label for="capacity">'+t('limit')+'</label><select id="capacity">'+['300','500','800','1000','custom','unlimited'].map(v=>'<option value="'+v+'" '+((v===p().capacity||v==='custom'&&!['300','500','800','1000','unlimited'].includes(p().capacity))?'selected':'')+'>'+(/^[0-9]+$/.test(v)?v:t(v))+'</option>').join('')+'</select></div><div id="customBox" class="field" '+(['300','500','800','1000','unlimited'].includes(p().capacity)?'hidden':'')+'><label for="customValue">'+t('customValue')+'</label><input id="customValue" type="number" min="1" step="1" value="'+(!['300','500','800','1000','unlimited'].includes(p().capacity)?esc(p().capacity):'1200')+'"></div><p id="unlimitedWarning" class="hint" '+(p().capacity==='unlimited'?'':'hidden')+'>'+t('unlimitedWarn')+'</p>'+btn('save','saveCapacity','primary')+'<p class="small muted">'+t('budgetNote')+'</p></section><section class="item"><h3>'+t('sim')+'</h3><div class="row">'+btn('simSuccess','simSuccess')+btn('simFail','simFail')+btn('simNo','simNo')+'</div></section><section class="item"><h3>'+t('appearance')+'</h3><p>'+t('skin')+'</p><div class="row">'+btn('theme','theme')+btn('lang','lang')+'</div><p class="small muted">'+t('localeNote')+'</p></section><section class="item"><h3>'+t('offline')+'</h3><p class="muted">'+t('offlineNote')+'</p></section></div>'}
function showModal(kind){modalKind=kind;drawModal();modal.showModal();}
function drawModal(){if(modalKind==='decision'){modal.innerHTML='<div class="modal"><div class="modal-head"><h2>'+t('simulateDecision')+'</h2>'+btn('cancel','close')+'</div><p>'+t('decisionNote')+'</p><div class="footer">'+btn('decisionAccept','decAccept')+btn('decisionModify','decModify')+btn('decisionReject','decReject')+'</div></div>';return}if(modalKind==='import')modal.innerHTML='<div class="modal"><div class="modal-head"><div><span class="eyebrow">IMPORT / '+esc(p().name)+'</span><h2>'+t('importTitle')+'</h2></div>'+btn('cancel','close','quiet')+'</div><div class="field"><label for="file">'+t('file')+'</label><input id="file" type="file" accept=".txt,.md,.docx,.pdf,.png,.jpg,.jpeg,.webp,.gif"><small class="muted">'+t('importNote')+'</small></div><fieldset style="border:0;padding:0"><legend>'+t('purpose')+'</legend>'+[0,1,2,3].map(i=>'<label class="choice"><input type="radio" name="purpose" value="'+i+'" '+(i===(view==='chat'?0:1)?'checked':'')+'><strong>'+t('pur'+i)+'</strong><span>'+t('desc'+i)+'</span></label>').join('')+'</fieldset><div class="field"><label for="author">'+t('author')+'</label><select id="author">'+['unknown','person','ai','collab'].map(v=>'<option value="'+v+'">'+t(v)+'</option>').join('')+'</select></div><small class="muted">'+t('added')+': '+t('importer')+'</small><div class="footer">'+btn('cancel','close')+btn('import','importSave','primary')+'</div></div>';
else modal.innerHTML='<div class="modal"><div class="modal-head"><h2>'+t('versions')+'</h2>'+btn('cancel','close','quiet')+'</div>'+(p().versions.map((v,i)=>'<div class="item" style="margin:12px 0"><span class="badge">'+t('version')+' '+(p().versions.length-i)+'</span><p style="margin-top:10px">'+esc(v)+'</p><button data-restore="'+i+'" '+(i===0?'disabled':'')+'>'+t('restore')+'</button></div>').join('')||'<p>'+t('emptyProfile')+'</p>')+'</div>';}
function act(a){if(a==='theme'){dark=!dark;render();return}if(a==='lang'){lang=lang==='pl'?'en':'pl';render();if(modal.open)drawModal();return}
if(a==='setup'){stopPending();adding=false;provider=p().provider;model=p().model;scribe=p().scribe;scribeModel=p().scribeModel;name=p().name;key='';tested=false;connectError=false;onboarding=true;step=0;render();return}if(a==='open'){adding=false;onboarding=false;render();return}
if(a==='next'){if(step===1&&!tested)return;step=Math.min(3,step+1);render();return}if(a==='back'){step--;render();return}
if(a==='test'||a==='testError'){tested=a==='test';connectError=!tested;render();return}
if(a==='chooseName'){name='Orion';render();return}
if(a==='launch'){if(!name.trim()){toast(t('requiredName'));return}if(adding){profiles.push({name:name.trim(),mode:'standard',provider,model,scribe,scribeModel,lastMemoryStatus:null,capacity:'300',context:'',versions:[],outdated:false,files:[],chats:[{title:t('newChat'),messages:[]}],chat:0,events:[]});pi=profiles.length-1;}else{p().name=name.trim();p().mode=mode;p().provider=provider;p().model=model;p().scribe=scribe;p().scribeModel=scribeModel;}key='';adding=false;onboarding=false;view='chat';render();return}
if(a==='newProfile'){stopPending();adding=true;mode='standard';provider='OpenRouter';model='Selected model';scribe=true;scribeModel='small';endpoint='';name='';key='';tested=false;connectError=false;step=0;onboarding=true;render();return}
if(a==='newChat'){stopPending();p().chats.push({title:t('newChat'),messages:[]});p().chat=p().chats.length-1;view='chat';render();return}
if(a==='panel'){panel=!panel;render();return}if(a==='memory'){view='memory';render();return}
if(a==='import'||a==='versions'){showModal(a);return}if(a==='close'){modal.close();return}
if(a==='importSave'){const file=document.getElementById('file').files[0];if(!file){toast(t('requiredFile'));return}const purpose=modal.querySelector('input[name=purpose]:checked').value;const author=document.getElementById('author').value;p().files.push({id:++fileSequence,name:file.name,purpose,author,chat:p().chat,date:'11.10.2026',decision:null,enabled:purpose==='2'});modal.close();if(purpose!=='0')view='knowledge';render();return}
if(a==='outdated'){p().outdated=!p().outdated;p().lastMemoryStatus=p().outdated?'withdrawnStatus':'reactivatedStatus';render();return}
if(a==='saveCapacity'){let v=document.getElementById('capacity').value;if(v==='custom'){const n=Number(document.getElementById('customValue').value);if(!Number.isSafeInteger(n)||n<1){toast(t('invalid'));return}v=String(n)}p().capacity=v;toast(t('saved'));render();return}
if(a.startsWith('dec')){const f=p().files.find(x=>x.id===decisionFile);if(!f)return;f.decision=a==='decAccept'?'accept':a==='decModify'?'modify':'reject';modal.close();render();return}
if(a.startsWith('sim')){p().lastMemoryStatus=a==='simNo'?'simNo':p().capacity==='unlimited'?'simUnlimited':a==='simSuccess'?'attempt2':'attemptFailed';if(a==='simNo'){p().events.unshift({key:'simNo',time:'P0 · DEMO'});}else if(p().capacity==='unlimited'){p().events.unshift({key:'simUnlimited',time:'P0 · DEMO'});}else{const n=Number(p().capacity);p().events.unshift({key:'attempt1',detail:(n+138)+' / '+n,bad:true},{key:a==='simSuccess'?'attempt2':'attemptFailed',detail:(a==='simSuccess'?Math.max(1,n-13):n+57)+' / '+n,bad:a!=='simSuccess'});if(a==='simSuccess'){p().versions.unshift(p().context||D.pl.contextBody);p().context=(lang==='pl'?'Aktualizacja demonstracyjna: ':'Demo update: ')+p().versions[0];p().versions[0]=p().context;p().outdated=false}else toast(t('kept'));}view='activity';render();return}
if(a==='send'){const input=document.getElementById('message');const text=input.value.trim();if(!text||timer)return;const target=p(),chat=target.chats[target.chat];chat.messages.push({who:'human',text});chat.draft='';pendingProfile=target;timer=setTimeout(()=>{chat.messages.push({who:'ai',text:t('demoReply')});timer=null;pendingProfile=null;render()},1800);render();return}
if(a==='stop'){stopPending();toast(t('stopped'));render();return}}
function stopPending(){if(timer){clearTimeout(timer);timer=null;pendingProfile=null}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action)act(b.dataset.action);else if(b.dataset.mode){if(b.dataset.mode==='conscious')return;mode=b.dataset.mode;render()}else if(b.dataset.view){view=b.dataset.view;render()}else if(b.dataset.chat){stopPending();p().chat=Number(b.dataset.chat);view='chat';render()}else if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.decision){decisionFile=Number(b.dataset.decision);showModal('decision')}else if(b.dataset.guidance){const f=p().files.find(x=>String(x.id)===b.dataset.guidance);f.enabled=!f.enabled;render()}});
modal.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action)act(b.dataset.action);else if(b.dataset.restore){const v=p().versions[Number(b.dataset.restore)];p().versions.unshift(v);p().context=v;p().outdated=false;p().lastMemoryStatus='restoredStatus';drawModal();render();toast(t('restored'))}});
function invalidateConnection(){tested=false;connectError=false;const status=document.getElementById('connectionStatus');if(status){status.textContent=t('needsTest');status.className='muted'}const next=root.querySelector('[data-action="next"]');if(next&&step===1)next.disabled=true;}
root.addEventListener('input',e=>{const x=e.target;if(x.id==='message')p().chats[p().chat].draft=x.value;if(x.id==='key'){key=x.value;invalidateConnection()}if(x.id==='name')name=x.value;if(x.id==='endpoint'){endpoint=x.value;invalidateConnection()}});
root.addEventListener('change',e=>{const x=e.target;if(x.id==='provider'){provider=x.value;tested=false;connectError=false;render()}if(x.id==='profile'){stopPending();pi=Number(x.value);view='chat';render()}if(x.id==='scribe'){scribe=x.value==='on';render()}if(x.id==='model')model=x.value;if(x.id==='scribeModel')scribeModel=x.value;if(x.id==='capacity'){document.getElementById('customBox').hidden=x.value!=='custom';document.getElementById('unlimitedWarning').hidden=x.value!=='unlimited'}});
root.addEventListener('keydown',e=>{if(e.target.id==='message'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!timer)act('send')}});
render();
})();
</script>
