[package]
name = "ai-home"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
[lib]
name = "ai_home"
crate-type = ["staticlib", "cdylib", "rlib"]
[[bin]]
name = "ai-home"
path = "src/main.rs"
required-features = ["desktop"]
[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-runtime", "dep:tauri-runtime-wry", "dep:tauri-macros"]
[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
# Keep Tauri's generated-code/build family on the audited compatible graph.
tauri-utils = "=2.9.3"
tauri-codegen = "=2.6.3"
[dependencies]
tauri = { version = "=2.11.5", features = [], optional = true }
# Avoid selecting the newer runtime family before the first committed Cargo.lock.
tauri-macros = { version = "=2.6.3", optional = true }
tauri-runtime = { version = "=2.11.3", optional = true }
tauri-runtime-wry = { version = "=2.11.4", optional = true }
serde_json = "=1.0.151"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
regex = "=1.13.1"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "=1.53.1", features = ["sync", "rt-multi-thread", "macros", "time", "net", "io-util"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
uuid = { version = "=1.28.0", features = ["v4"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
