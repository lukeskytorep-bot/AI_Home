[package]
name = "ai-home"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
[lib]
name = "ai_home"
crate-type = ["staticlib", "cdylib", "rlib"]
[[bin]]
name = "ai-home"
path = "src/main.rs"
required-features = ["desktop"]
[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-runtime", "dep:tauri-runtime-wry", "dep:tauri-macros", "dep:tauri-plugin-dialog"]
[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
# Keep Tauri's generated-code/build family on the audited compatible graph.
tauri-utils = "=2.9.3"
tauri-codegen = "=2.6.3"
[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tauri = { version = "=2.11.5", features = [], optional = true }
# Avoid selecting the newer runtime family before the first committed Cargo.lock.
tauri-macros = { version = "=2.6.3", optional = true }
tauri-runtime = { version = "=2.11.3", optional = true }
tauri-runtime-wry = { version = "=2.11.4", optional = true }
serde_json = "=1.0.151"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
regex = "=1.13.1"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "=1.53.1", features = ["sync", "rt-multi-thread", "macros", "time", "net", "io-util"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
uuid = { version = "=1.28.0", features = ["v4"] }
# Document import dependencies adapted from the audited Harness snapshot.
base64 = "=0.22.1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
roxmltree = "=0.20.0"
lopdf = { version = "=0.36.0", default-features = false }
tauri-plugin-dialog = { version = "=2.7.2", optional = true }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
