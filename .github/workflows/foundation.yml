name: AI Home foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:boundaries
      - run: npm test
      - run: npm run build
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Rust tests and initial lock resolution
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: npm run tauri build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: native-foundation-${{ matrix.os }}
          path: |
            src-tauri/Cargo.lock
            src-tauri/gen/
            src-tauri/target/release/build/ai-home-*/out/
            src-tauri/target/release/ai-home
            src-tauri/target/release/ai-home.exe
          if-no-files-found: error
